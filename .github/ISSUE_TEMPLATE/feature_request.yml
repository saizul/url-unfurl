name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could url-unfurl help? A sample page (URL or HTML) and the output you expect are very useful.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
