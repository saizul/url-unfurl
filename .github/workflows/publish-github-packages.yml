name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@saizul'
      - run: npm ci
      - run: npm test
      # GitHub Packages requires a scoped name that matches the repository owner.
      # package.json already uses @saizul/url-unfurl and publishConfig points at
      # npm.pkg.github.com; this step only guards against accidental edits.
      - name: Check the package scope and registry
        run: |
          test "$(npm pkg get name)" = '"@saizul/url-unfurl"'
          test "$(npm pkg get publishConfig.registry)" = '"https://npm.pkg.github.com"'
      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
